<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سنگ‌نمای آبی | نمونه کارها</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f4f4; text-align: center; padding: 20px; }

        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-top: 30px; }

    </style>
</head>
<body>
    <h1>سنگ‌نمای آبی</h1>
    <p>نمونه کارها و مدل‌های اجرا شده</p>

    <div class="gallery">
        <!-- اینجا عکس‌های خودت رو جایگزین کن -->

        <img src="179.png" alt="مدل ۲">
        <img src="عکس۳.jpg" alt="مدل ۳">
    </div>
</body>
</html>
